name: Build Staging (Apple IAP Sandbox)

# Builds the STAGING variant of the CompanioNation iOS wrapper.
#
# The staging build points the embedded WebView at the Azure staging slot
# (https://companionation-alt.azurewebsites.net) and shows an on-screen "STAGING"
# banner plus a "CompanioNation (Staging)" home-screen name, so it can be used for
# Apple In-App Purchase *sandbox* testing without any risk of being confused with,
# or submitted in place of, the production build.
#
# Run it manually from the GitHub Actions tab (workflow_dispatch).
#
# Signed .ipa export (optional):
#   To produce a signed, installable/TestFlight-ready .ipa, add these repo secrets:
#     IOS_CERTIFICATE_P12_BASE64       - base64 of your Apple distribution .p12
#     IOS_CERTIFICATE_PASSWORD         - password for that .p12
#     IOS_PROVISIONING_PROFILE_BASE64  - base64 of a provisioning profile for
#                                        com.companionation.app (matching the
#                                        export method below)
#     IOS_KEYCHAIN_PASSWORD            - any throwaway password for the temp keychain
#     IOS_EXPORT_METHOD                - e.g. "app-store" or "ad-hoc" (optional;
#                                        defaults to "app-store")
#   When these secrets are absent, the job falls back to an unsigned archive build
#   purely to verify the Staging configuration compiles.

on:
  workflow_dispatch:
    inputs:
      export_signed_ipa:
        description: "Export a signed .ipa (requires signing secrets)"
        type: boolean
        default: false

jobs:
  build-staging:
    runs-on: macos-latest

    env:
      SCHEME: "pwa-shell (Staging)"
      CONFIGURATION: Staging
      PROJECT: pwa-shell.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Determine signing availability
        id: signing
        run: |
          if [ "${{ inputs.export_signed_ipa }}" = "true" ] && [ -n "${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Unsigned compile verification (no signing secrets) ----------------
      - name: Build (unsigned verification)
        if: steps.signing.outputs.signed == 'false'
        run: |
          xcodebuild \
            -workspace pwa-shell.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # ---- Signed archive + export (signing secrets present) -----------------
      - name: Import signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/staging.mobileprovision"

      - name: Archive
        if: steps.signing.outputs.signed == 'true'
        run: |
          xcodebuild \
            -workspace pwa-shell.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CompanioNationStaging.xcarchive" \
            clean archive

      - name: Export .ipa
        if: steps.signing.outputs.signed == 'true'
        run: |
          EXPORT_METHOD="${{ secrets.IOS_EXPORT_METHOD }}"
          if [ -z "$EXPORT_METHOD" ]; then EXPORT_METHOD="app-store"; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CompanioNationStaging.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload .ipa artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CompanioNation-Staging-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
