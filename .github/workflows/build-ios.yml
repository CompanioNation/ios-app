name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install

      - name: Configure signing for main target only
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('pwa-shell.xcodeproj')
            project.targets.each do |target|
              next unless target.name == 'pwa-shell'
              target.build_configurations.each do |config|
                next unless config.name == 'Release'
                config.build_settings['CODE_SIGN_STYLE']              = 'Manual'
                config.build_settings['DEVELOPMENT_TEAM']              = '${{ secrets.APPLE_TEAM_ID }}'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'CompanioNation App Store'
                config.build_settings['CODE_SIGN_IDENTITY']            = 'Apple Distribution'
                config.build_settings['PRODUCT_BUNDLE_IDENTIFIER']     = 'com.companionation.app'
              end
            end
            project.save
          "

      - name: Install signing certificate
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Copy GoogleService-Info.plist to Entitlements folder
        run: |
          cp pwa-shell/GoogleService-Info.plist pwa-shell/Entitlements/GoogleService-Info.plist
      
      - name: Bump build number
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" pwa-shell/Info.plist

      - name: Build (no signing)
        if: env.P12_BASE64 == ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          xcodebuild build \
            -workspace pwa-shell.xcworkspace \
            -scheme pwa-shell \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build archive (with signing)
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          xcodebuild archive \
            -workspace pwa-shell.xcworkspace \
            -scheme pwa-shell \
            -archivePath build/CompanioNation.xcarchive \
            -destination 'generic/platform=iOS'

      - name: Export IPA
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.companionation.app</key>
                  <string>CompanioNation App Store</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/CompanioNation.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Write the API key to the location Xcode tools expect
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Find the IPA
          IPA_PATH=$(find build/output -name "*.ipa" | head -1)
          echo "Uploading $IPA_PATH"

          # Upload to App Store Connect
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: env.P12_BASE64 != ''
        uses: actions/upload-artifact@v4
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        with:
          name: CompanioNation-iOS
          path: build/output/*.ipa

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
